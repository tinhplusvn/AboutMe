<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | tinhplusvn</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- BIẾN MÀU SẮC (Giữ nguyên màu mặc định) --- */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #343a40;
            --text-sub: #6c757d;
            --border-color: #eee;
            --icon-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --toggle-bg: #e9ecef;
            --toggle-icon: #343a40;
            --pink-color: #ed1c5b;
            --pink-hover: #c4124a;
            --tiktok-color: #000000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #121212;
                --bg-card: #1e1e1e;
                --text-main: #f8f9fa;
                --text-sub: #adb5bd;
                --border-color: #333;
                --icon-bg: #2a2a2a;
                --shadow: rgba(0, 0, 0, 0.5);
                --shadow-hover: rgba(255, 255, 255, 0.1);
                --toggle-bg: #333;
                --toggle-icon: #f8f9fa;
                --tiktok-color: #ffffff;
            }
        }

        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
            --text-sub: #adb5bd;
            --border-color: #333;
            --icon-bg: #2a2a2a;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-hover: rgba(255, 255, 255, 0.1);
            --toggle-bg: #333;
            --toggle-icon: #f8f9fa;
            --tiktok-color: #ffffff;
        }

        body.light-mode {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #343a40;
            --text-sub: #6c757d;
            --border-color: #eee;
            --icon-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.15);
            --toggle-bg: #e9ecef;
            --toggle-icon: #343a40;
            --tiktok-color: #000000;
        }

        /* --- Cài đặt chung --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow);
            position: relative;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--toggle-bg);
            color: var(--toggle-icon);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .avatar-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-card);
            box-shadow: 0 5px 15px var(--shadow);
        }

        .name-title {
            color: #0000cd;
            font-family: 'Dancing Script', cursive;
            font-size: 38px;
            margin-bottom: 5px;
        }
        
        body.dark-mode .name-title { color: #6a9cff; }
        @media (prefers-color-scheme: dark) {
            .name-title { color: #6a9cff; }
        }

        .role-title {
            color: #4169e1;
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            margin-bottom: 30px;
        }
        body.dark-mode .role-title { color: #8bb0ff; }
        @media (prefers-color-scheme: dark) {
            .role-title { color: #8bb0ff; }
        }

        .contact-section {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s ease-out, opacity 0.5s ease-out, margin-top 0.3s;
            margin-top: 0;
        }

        .contact-section.show {
            max-height: 500px;
            opacity: 1;
            margin-top: 20px;
        }

        .contact-title {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-items: center;
            margin-bottom: 30px;
        }

        .icon-box {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            background-color: var(--icon-bg);
            border: 2px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .icon-phone { color: #3b5998; border-color: #3b5998; } 
        .icon-telegram { color: #0088cc; border-color: #0088cc; } 
        .icon-youtube { color: #ff0000; border-color: #ff0000; } 
        .icon-zalo { color: #0068ff; border-color: #0068ff; } 
        .icon-messenger { color: #0084ff; border-color: #0084ff; } 
        .icon-tiktok { 
            color: var(--tiktok-color); 
            border-color: var(--tiktok-color); 
        }

        .icon-box:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 15px var(--shadow-hover);
        }

        .icon-phone i {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        .thank-you {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .qr-section {
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 250px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.5s ease-out, opacity 0.4s ease-out, margin-top 0.3s, padding-top 0.3s;
        }

        .contact-section.show ~ .qr-section {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            margin-top: 0;
            margin-bottom: 0;
            border-top: none;
        }

        .qr-label {
            font-family: 'Dancing Script', cursive;
            color: var(--text-sub);
            font-size: 20px;
            margin-bottom: 15px;
        }

        .qr-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 16px;
            padding: 10px;
            background-color: #ffffff;
            box-shadow: 0 5px 15px var(--shadow);
            transition: transform 0.3s ease;
        }

        .qr-img:hover {
            transform: scale(1.05);
        }

        .add-btn {
            background-color: var(--pink-color);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            margin: 0 auto;
            box-shadow: 0 8px 20px rgba(237, 28, 91, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.3s ease, background-color 0.3s;
        }

        .add-btn:hover {
            transform: scale(1.1);
        }

        .add-btn.active {
            transform: rotate(45deg);
            background-color: var(--pink-hover);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <button class="theme-toggle" id="themeToggle" title="Chế độ: Tự động">
            <i class="fas fa-magic"></i>
        </button>

        <div class="avatar-container">
            <img src="avatar.jpg" alt="Đinh Xuân Tình" class="avatar-img">
        </div>
        
        <h1 class="name-title">Đinh Xuân Tình</h1>
        <h2 class="role-title">Editor & Developer</h2>

        <div class="contact-section" id="contactInfo">
            <h3 class="contact-title">Liên hệ tôi</h3>
            
            <div class="icon-grid">
                <!-- Đã thêm link mẫu vào các nút (thay thế bằng link thật của bạn) -->
                <a href="tel:0977089961" class="icon-box icon-phone" title="Gọi điện"><i class="fas fa-phone-alt"></i></a>
                <a href="https://t.me/tinhplusvn" target="_blank" class="icon-box icon-telegram" title="Telegram"><i class="fab fa-telegram-plane"></i></a>
                <a href="https://youtube.com/@tinhplusvn" target="_blank" class="icon-box icon-youtube" title="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="https://zalo.me/tinhplusvn" target="_blank" class="icon-box icon-zalo" title="Zalo"><i class="fas fa-comment-dots"></i></a> 
                <a href="https://m.me/tinhplusvn" target="_blank" class="icon-box icon-messenger" title="Messenger"><i class="fab fa-facebook-messenger"></i></a>
                <a href="https://tiktok.com/@tinhplusvn" target="_blank" class="icon-box icon-tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
            </div>

            <h3 class="thank-you">Xin Cảm Ơn !</h3>
        </div>

        <div class="qr-section" id="qrSection">
            <span class="qr-label">Quét mã để kết nối</span>
            <img src="qr.jpg" alt="Mã QR liên hệ" class="qr-img">
        </div>

        <button class="add-btn" id="toggleBtn">+</button>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const contactInfo = document.getElementById('contactInfo');

        toggleBtn.addEventListener('click', function() {
            contactInfo.classList.toggle('show');
            toggleBtn.classList.toggle('active');
            
            if (toggleBtn.classList.contains('active')) {
                toggleBtn.innerHTML = '×'; 
            } else {
                toggleBtn.innerHTML = '+';
            }
        });

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        
        let currentTheme = localStorage.getItem('theme') || 'auto';

        function applyTheme(theme) {
            body.classList.remove('light-mode', 'dark-mode');
            
            if (theme === 'light') {
                body.classList.add('light-mode');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                themeToggle.title = 'Chế độ: Sáng';
            } else if (theme === 'dark') {
                body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                themeToggle.title = 'Chế độ: Tối';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-magic"></i>';
                themeToggle.title = 'Chế độ: Tự động';
            }
            
            localStorage.setItem('theme', theme);
        }

        applyTheme(currentTheme);

        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'auto') {
                currentTheme = 'light';
            } else if (currentTheme === 'light') {
                currentTheme = 'dark';
            } else {
                currentTheme = 'auto';
            }
            applyTheme(currentTheme);
        });
    </script>

</body>
</html>
